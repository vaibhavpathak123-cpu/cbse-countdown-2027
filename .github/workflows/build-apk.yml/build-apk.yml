
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip CBSE_Board_Exam_Countdown_2027_Android_Project.zip -d source

      - name: Build APK
        run: gradle -p source/CBSE_Board_Exam_Countdown_2027 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CBSE-Board-Exam-Countdown-2027
          path: source/CBSE_Board_Exam_Countdown_2027/app/build/outputs/apk/debug/app-debug.apk
