
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o CBSE_Board_Exam_Countdown_2027_Android_Project.zip -d source

      - name: Build APK
        run: |
          gradle -p source/CBSE_Board_Exam_Countdown_2027 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CBSE-Board-Exam-Countdown-2027
          path: source/CBSE_Board_Exam_Countdown_2027/app/build/outputs/apk/debug/app-debug.apk
          # trigger build
